services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      TASK_GARDEN_ENV: production
      TASK_GARDEN_HOSTED_MODE: "true"
      TASK_GARDEN_LOCAL_ONLY_MODE: "false"
      TASK_GARDEN_DATABASE_URL: postgresql+psycopg://task_garden:task_garden_dev_password@db:5432/task_garden
      TASK_GARDEN_CORS_ALLOWED_ORIGINS: http://127.0.0.1:15174,http://localhost:15174,http://localhost:4173
      TASK_GARDEN_SINGLE_USER_AUTH_TOKEN: replace-with-a-long-random-token
      TASK_GARDEN_SYNC_PROVIDER: remote_api
      TASK_GARDEN_AUTH_PROVIDER: bearer_token
      TASK_GARDEN_TASK_EXTRACTION_PROVIDER: mock
      TASK_GARDEN_RECAP_NARRATIVE_PROVIDER: off
      TASK_GARDEN_STT_PROVIDER: local_stub
      TASK_GARDEN_AUDIO_STORAGE_DIR: /tmp/task-garden-audio
    ports:
      - "18080:8000"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: task_garden
      POSTGRES_USER: task_garden
      POSTGRES_PASSWORD: task_garden_dev_password
    volumes:
      - task-garden-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_garden -d task_garden"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  task-garden-postgres:
